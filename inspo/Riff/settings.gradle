pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'Riff'
include ':app'
include ':indexer'
include ':configuration'

// A source dependency keeps the standalone parser authoritative without publishing a local fork.
includeBuild('standalone/cuegrain') {
    dependencySubstitution {
        substitute module('link.roadio.cuegrain:cuegrain-core') using project(':core')
    }
}

// Cuetree is the sole library/catalog source. Its core keeps Android outside its own build.
includeBuild('standalone/cuetree') {
    dependencySubstitution {
        substitute module('link.roadio.cuetree:cuetree-core') using project(':core')
    }
}
